      - name: FTP-Deploy-Action
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          server-dir: ./
          timeout: 60000
          dangerous-clean-slate: false
          state-name: '.ftp-deploy-sync-state.json'
          log-level: minimal
          exclude: |
            - .git*
            - .git/**
            - node_modules/**
            - tests/**
            - .github/**
            - .env
            - .env.*
            - .vscode/**
            - README.md
            - composer.json
            - composer.lock
            - package.json
            - package-lock.json
            - vite.config.js
            - tailwind.config.js
            - postcss.config.js
            - .editorconfig
            - .gitignore
            - .env.example
            - bootstrap/cache/*.php
            - storage/logs/**
            - storage/framework/cache/**
            - storage/framework/sessions/**
            - storage/framework/views/**